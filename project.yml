name: LEVER
options:
  bundleIdPrefix: com.rakshit1998
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 48TGY734WW
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  LEVER:
    type: application
    platform: iOS
    sources:
      - path: LEVER
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    dependencies:
      - target: LEVERShareExtension
      - target: LEVERWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakshit1998.lever
        INFOPLIST_FILE: LEVER/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LEVER/Resources/LEVER.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets:
        - LEVERTests
        - LEVERUITests
      gatherCoverageData: true
      storeKitConfiguration: LEVER/Resources/Products.storekit
  LEVERShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakshit1998.lever.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/LEVERShareExtension.entitlements
        SKIP_INSTALL: "YES"
  LEVERWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakshit1998.lever.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/LEVERWidgets.entitlements
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LEVERTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LEVERTests
    dependencies:
      - target: LEVER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakshit1998.lever.tests
        GENERATE_INFOPLIST_FILE: "YES"
  LEVERUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LEVERUITests
    dependencies:
      - target: LEVER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakshit1998.lever.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: LEVER
